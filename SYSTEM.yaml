# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: web.atlas.docs
repository:
  id: repo.atlas-site
  github: matuteiglesias/atlas-pobreza-docs
domain: web
system: web.atlas
role: poverty-documentation-surface
