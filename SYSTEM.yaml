upstream:
- repo.indice-pobreza-uba
downstream: []
canonical_commands:
- python scripts/verify_deployment_config.py
- yarn build
generated_paths:
- build/
verification:
  status: partial
  last_verified: '2026-08-04'
  command: python scripts/verify_deployment_config.py
  unknowns:
  - deployment configuration is intentionally red until placeholder metadata is repaired
maintenance:
  cadence: annual
  next_review: '2027-02-01'
