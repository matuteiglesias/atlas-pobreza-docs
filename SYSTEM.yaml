# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: docs.argentina-poverty.engineering
repository:
  id: repo.atlas-pobreza-docs
  github: matuteiglesias/atlas-pobreza-docs
domain: web
system: argentina-poverty
role: ecosystem-engineering-documentation-authority
lifecycle: active
authority:
  status: current
  owns:
  - cross-repository engineering architecture for the Argentina poverty ecosystem
  - repository-boundary map and accepted integration intent
  - cross-system contract and artifact registry at architecture level
  - shared current-state vocabulary and responsibility boundaries
  - migration/status documentation and precedence over dated working notes
  - autonomous documentation-maintenance guidance and carry state
  does_not_own:
  - producer-repository implementation, scientific method, concrete values or QA
  - official EPH, Census, IPC, poverty-line or geography authority
  - income-model training, Census scoring, poverty estimation or Atlas runtime
  - commissioning status owned by indice-pobreza-UBA/science/commissioning/registry.json
  - the right to upgrade producer publication/interpretation permissions
interfaces:
  consumes:
  - metadata:producer-system-boundaries
  - metadata:producer-contracts-and-release-evidence
  - metadata:producer-scientific-commissioning-evidence
  produces:
  - publication:argentina-poverty-engineering-docs@1
upstream:
- repo.microdatos-eph-indec
- repo.income-modeling-eph
- repo.eph-censo-aligner
- repo.sampler-censo-arg
- repo.encuestador-de-hogares
- repo.ipc-argentina
- repo.canastasindec
- repo.indice-pobreza-uba
- repo.argentina-geography
- repo.argentina-poverty-atlas
downstream:
- engineers
- researchers
- maintainers
- autonomous-agents
canonical_commands:
- npm ci
- npm run build
- python scripts/verify_deployment_config.py
generated_paths:
- build/
verification:
  status: post-commissioning-current
  last_verified: '2026-09-28'
  command: npm run build
  notes:
  - repository ownership is frozen in docs/architecture/01-system-map.md
  - 2024-Q3 D-1/L2/L3/L4 commissioning is terminal; reruns require registry triggers
  - Poverty v2 is the measurement/release authority and Atlas is a capability-gated terminal consumer
  - province and department geography identity gates are commissioned at 24/24 and 525/525
  - the code/contract envelope supports 2022-Q1..2025-Q4 where governed parents exist
  - logical support does not imply every predictive period/release is materialized
  - no research result in this chain is official poverty statistics
  unknowns:
  - exact 2022-2025 period-by-capability materialization state requires the governed capability census
  - aggregate poverty-estimate uncertainty remains not supplied
  - CPV-2022 donor-frame sensitivity remains a bounded future experiment
  - approved general-purpose monetary-conversion status remains distinct from candidate publication
  - Atlas indexability/research_public presentation remains a separate publication decision
maintenance:
  cadence: trigger-driven-weekly-safety-pass
  next_review: '2026-10-02'
  guide: docs/maintenance/00_START_HERE.md
  carry_state: docs/maintenance/carry_state.yaml
